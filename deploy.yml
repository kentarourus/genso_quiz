name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # デプロイ対象のブランチ名（masterの場合は変更してください）

# ページのデプロイに必要な権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Jekyllの自動処理を無効化する「.nojekyll」ファイルを強制生成
      # これにより sitemap.xml がそのまま application/xml として配信されます
      - name: Disable Jekyll
        run: touch .nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # リポジトリのルート（またはビルド後のディレクトリ）を指定
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
