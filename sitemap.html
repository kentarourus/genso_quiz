---
layout: default
title: sitemap
permalink: /sitemap.html
---

<h1>{{ page.title }}</h1>

<ul>
  {% for p in site.pages %}
    {% if p.title and p.url != "/sitemap.html" %}
      <li><a href="{{ p.url | relative_url }}">{{ p.title }}</a></li>
    {% endif %}
  {% endfor %}

  {% for post in site.posts %}
    <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a></li>
  {% endfor %}
</ul>
